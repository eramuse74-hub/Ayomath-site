<!--
  Satu arena bersama untuk semua event: ../latihan/arena.html?event=<slug>
  (pola yang sama dipakai admin.html dan /lomba/). Halaman ini hanya
  meneruskan, supaya alamat pendek www.ayomath.com/lomba/ioa-lombok-bangkit/arena.html
  (di kartu, surat sekolah, panduan-admin) tetap jalan dan perbaikan arena
  cukup dibuat di satu berkas. Semua parameter ikut (?batch=, ?embed=1,
  ?replay=1); dari=skeddo menjadi embed=1, sama seperti live.html.
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('dari') === 'skeddo') { q.set('embed', '1'); q.delete('dari'); }
  q.set('event', 'ioa-lombok-bangkit');
  location.replace('../latihan/arena.html?' + q.toString() + location.hash);
})();
</script>
</head>
